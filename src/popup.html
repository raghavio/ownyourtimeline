<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>OwnYourTimeline</title><link rel="stylesheet" href="popup.css"><script defer src="popup.js"></script></head>
<body><main>
<h1>OwnYourTimeline</h1>
<p id="status" role="status" aria-live="polite">Loading…</p>

<label class="toggle"><input id="enabled" type="checkbox"> Filtering enabled</label>
<label for="prompt">Feed instruction</label>
<textarea id="prompt" rows="6" maxlength="2000" placeholder="Nothing political"></textarea>
<button id="apply">Apply</button>
<p class="hint">Applying, pausing or resuming reloads open X Home tabs.</p>
<label><input id="showFilteredTab" type="checkbox"> Show a Filtered tab with hidden posts</label>

<label for="key">TypeSafe API key</label>
<input id="key" type="password" autocomplete="off" placeholder="Enter or replace key">
<label><input id="remember" type="checkbox"> Remember key on this device</label>
<div class="row"><button id="saveKey">Save and test key</button><button id="removeKey">Remove key</button></div>
<p id="keyStatus" class="hint" role="status"></p>

<section id="debug" hidden>
<h2>Debug log</h2>
<p class="hint">Dev build: every Home response, classifier request and outcome is recorded (latest 500 events). The export contains post text and your instruction, never your key.</p>
<div class="row"><button id="exportLog">Export log</button><button id="clearLog">Clear log</button></div>
<p id="debugStatus" class="hint" role="status"></p>
</section>
</main></body></html>
